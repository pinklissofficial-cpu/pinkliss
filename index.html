<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink&Liss | Premium Cosmetics</title>
  <meta name="description" content="Pink&Liss premium cosmetics store with luxury black, pink and white design." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="#home">
        <span class="brand-mark"></span>
        <span>Pink&Liss</span>
      </a>

      <nav class="navlinks">
        <a href="#home" data-link="home">Home</a>
        <a href="#shop" data-link="shop">Shop</a>
        <a href="#categories" data-link="categories">Categories</a>
        <a href="#admin" data-link="admin">Admin</a>
      </nav>

      <button class="cart-btn" id="openCartBtn" type="button">
        Cart <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <div class="drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h3>Your Cart</h3>
        <button class="icon-btn" id="closeCartBtn" type="button">✕</button>
      </div>
      <div id="cartItems" class="stack"></div>
      <div class="totals">
        <div class="row">
          <span>Total</span>
          <strong id="cartTotal">₹0</strong>
        </div>
        <button class="primary-btn full" id="checkoutBtn" type="button">Go to Checkout</button>
      </div>
    </div>
  </div>

  <div class="modal" id="productModal" aria-hidden="true">
    <div class="modal-card">
      <button class="icon-btn close-modal" id="closeModalBtn" type="button">✕</button>
      <div id="productModalContent"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Pink&Liss — luxury cosmetics storefront built with HTML, CSS and JavaScript.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
